name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release-zip:
    name: Attach integration zip to the release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # HACS installs from the repo, but a versioned zip of the component is a
      # convenient manual-install artifact attached to each GitHub release.
      - name: Create zip
        run: |
          cd custom_components/oase
          zip -r "${{ github.workspace }}/oase.zip" .

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: oase.zip
